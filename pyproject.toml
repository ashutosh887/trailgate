[project]
name = "trailgate"
version = "0.1.0"
description = "A 2B decision model decides which camera-trap photos are worth a model's time: empty frames skipped, animals labelled by the right-sized Bedrock model, people and vehicles flagged to a ranger."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ashutosh887" }]
keywords = ["strands-decider-2b", "strands-agents", "amazon-bedrock", "model-routing", "camera-traps", "wildlife-conservation"]
dependencies = [
  "strands-decider[vision]>=0.2.0",
  "strands-agents>=1.62",
  "boto3>=1.40",
  "pillow>=11",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/ashutosh887/trailgate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trailgate", "patterns"]
